name: Rebuild Japanese PDF

on:
  push:
    paths:
      - 'paper/ja/main_ja.tex'
      - 'paper/ja/refs.bib'
      - 'paper/ja/fig1_body.tex'
      - 'paper/ja/build.sh'
      - '.github/workflows/rebuild-ja.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XeLaTeX and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-japanese fonts-noto-cjk poppler-utils
      - name: Build Japanese PDF
        working-directory: paper/ja
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Verify author
        working-directory: paper/ja
        run: |
          pdftotext main_ja.pdf - | tr -d ' ' > /tmp/main_ja.txt
          grep -q '宇都宮英之' /tmp/main_ja.txt
          ! grep -q '宇都宮英行' /tmp/main_ja.txt
      - name: Commit rebuilt PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/ja/main_ja.pdf paper/ja/main_ja.bbl
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Rebuild Japanese PDF with corrected author name'
            git push
          fi
