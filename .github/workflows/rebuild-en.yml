name: Rebuild English PDF

on:
  push:
    paths:
      - 'paper/en/main.tex'
      - 'paper/en/refs.bib'
      - '.github/workflows/rebuild-en.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Build English PDF
        working-directory: paper/en
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          cp main.log final.log

      - name: Verify build
        working-directory: paper/en
        run: |
          ! grep -q "There were undefined references" final.log
          ! grep -q "Citation .* undefined" final.log
          ! grep -q "Reference .* undefined" final.log
          pdftotext main.pdf - | grep -q "Shortest-side skeletons of edge-perimeter-minimizing polyhexes"
          pdftotext main.pdf - | grep -q "H. Utsunomiya"

      - name: Commit rebuilt PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/en/main.pdf paper/en/main.bbl
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild English PDF"
            git push
          fi
