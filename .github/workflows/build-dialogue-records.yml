name: Build dialogue-record PDFs

on:
  push:
    paths:
      - 'provenance/proof-reachability/opinions/Subsequent_Author_AI_Dialogue_NoteB_*.tex'
      - '.github/workflows/build-dialogue-records.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-chinese fonts-noto-cjk fonts-liberation poppler-utils

      - name: Build dialogue PDFs
        working-directory: provenance/proof-reachability/opinions
        run: |
          set -euo pipefail
          xelatex -interaction=nonstopmode -halt-on-error Subsequent_Author_AI_Dialogue_NoteB_ja.tex
          xelatex -interaction=nonstopmode -halt-on-error Subsequent_Author_AI_Dialogue_NoteB_en.tex

      - name: Verify PDFs
        working-directory: provenance/proof-reachability/opinions
        run: |
          set -euo pipefail
          test -s Subsequent_Author_AI_Dialogue_NoteB_ja.pdf
          test -s Subsequent_Author_AI_Dialogue_NoteB_en.pdf
          pdftotext Subsequent_Author_AI_Dialogue_NoteB_en.pdf - | grep -q "Subsequent Dialogue Between the Author and AI"
          ! grep -q 'SSGT' Subsequent_Author_AI_Dialogue_NoteB_ja.tex
          ! grep -q 'SSGT' Subsequent_Author_AI_Dialogue_NoteB_en.tex
          grep -q 'XXX' Subsequent_Author_AI_Dialogue_NoteB_ja.tex
          grep -q 'XXX' Subsequent_Author_AI_Dialogue_NoteB_en.tex

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/proof-reachability/opinions/Subsequent_Author_AI_Dialogue_NoteB_*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build subsequent author-AI dialogue PDFs"
            git push
          fi
